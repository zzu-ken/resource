<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #333; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
      .small-label { font-family: Arial, sans-serif; font-size: 12px; fill: #666; }
      .phase-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .phase-box-active { fill: #bbdefb; stroke: #1976d2; stroke-width: 3; }
      .arrow { stroke: #1976d2; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .cycle-arrow { stroke: #388e3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#1976d2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#388e3c" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title">MCP 生命周期</text>
  
  <!-- Phase 1: Initialization -->
  <rect x="50" y="80" width="180" height="120" rx="10" class="phase-box-active"/>
  <text x="140" y="110" text-anchor="middle" class="label" font-weight="bold">1. 初始化</text>
  <text x="140" y="135" text-anchor="middle" class="small-label">• 启动 Server</text>
  <text x="140" y="155" text-anchor="middle" class="small-label">• 建立连接</text>
  <text x="140" y="175" text-anchor="middle" class="small-label">• 能力协商</text>
  <text x="140" y="195" text-anchor="middle" class="small-label">• 交换元数据</text>
  
  <!-- Arrow to Phase 2 -->
  <line x1="230" y1="140" x2="280" y2="140" class="arrow"/>
  
  <!-- Phase 2: Discovery -->
  <rect x="280" y="80" width="180" height="120" rx="10" class="phase-box"/>
  <text x="370" y="110" text-anchor="middle" class="label" font-weight="bold">2. 发现</text>
  <text x="370" y="135" text-anchor="middle" class="small-label">• 列出可用工具</text>
  <text x="370" y="155" text-anchor="middle" class="small-label">• 列出可用资源</text>
  <text x="370" y="175" text-anchor="middle" class="small-label">• 列出可用提示</text>
  <text x="370" y="195" text-anchor="middle" class="small-label">• 获取 Schema</text>
  
  <!-- Arrow to Phase 3 -->
  <line x1="460" y1="140" x2="510" y2="140" class="arrow"/>
  
  <!-- Phase 3: Operation -->
  <rect x="510" y="80" width="180" height="120" rx="10" class="phase-box"/>
  <text x="600" y="110" text-anchor="middle" class="label" font-weight="bold">3. 操作</text>
  <text x="600" y="135" text-anchor="middle" class="small-label">• 调用工具</text>
  <text x="600" y="155" text-anchor="middle" class="small-label">• 读取资源</text>
  <text x="600" y="175" text-anchor="middle" class="small-label">• 获取提示</text>
  <text x="600" y="195" text-anchor="middle" class="small-label">• 订阅更新</text>
  
  <!-- Arrow to Phase 4 -->
  <line x1="690" y1="140" x2="740" y2="140" class="arrow"/>
  
  <!-- Phase 4: Cleanup -->
  <rect x="740" y="80" width="180" height="120" rx="10" class="phase-box"/>
  <text x="830" y="110" text-anchor="middle" class="label" font-weight="bold">4. 清理</text>
  <text x="830" y="135" text-anchor="middle" class="small-label">• 取消订阅</text>
  <text x="830" y="155" text-anchor="middle" class="small-label">• 关闭连接</text>
  <text x="830" y="175" text-anchor="middle" class="small-label">• 释放资源</text>
  <text x="830" y="195" text-anchor="middle" class="small-label">• 清理状态</text>
  
  <!-- Cycle arrow back to Operation -->
  <path d="M 830 200 Q 900 250 600 250" class="cycle-arrow"/>
  <text x="750" y="230" class="small-label">持续操作</text>
  
  <!-- Detailed flow for each phase -->
  
  <!-- Initialization Details -->
  <rect x="50" y="240" width="900" height="140" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="500" y="265" text-anchor="middle" class="label" font-weight="bold">初始化阶段详细流程</text>
  
  <circle cx="120" cy="300" r="25" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <text x="120" y="307" text-anchor="middle" class="small-label" fill="white" font-weight="bold">1</text>
  <text x="120" y="330" text-anchor="middle" class="small-label">启动</text>
  <text x="120" y="345" text-anchor="middle" class="small-label">Server</text>
  
  <line x1="145" y1="300" x2="245" y2="300" class="arrow"/>
  
  <circle cx="270" cy="300" r="25" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <text x="270" y="307" text-anchor="middle" class="small-label" fill="white" font-weight="bold">2</text>
  <text x="270" y="330" text-anchor="middle" class="small-label">建立</text>
  <text x="270" y="345" text-anchor="middle" class="small-label">连接</text>
  
  <line x1="295" y1="300" x2="395" y2="300" class="arrow"/>
  
  <circle cx="420" cy="300" r="25" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <text x="420" y="307" text-anchor="middle" class="small-label" fill="white" font-weight="bold">3</text>
  <text x="420" y="330" text-anchor="middle" class="small-label">发送</text>
  <text x="420" y="345" text-anchor="middle" class="small-label">initialize</text>
  
  <line x1="445" y1="300" x2="545" y2="300" class="arrow"/>
  
  <circle cx="570" cy="300" r="25" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <text x="570" y="307" text-anchor="middle" class="small-label" fill="white" font-weight="bold">4</text>
  <text x="570" y="330" text-anchor="middle" class="small-label">返回</text>
  <text x="570" y="345" text-anchor="middle" class="small-label">capabilities</text>
  
  <line x1="595" y1="300" x2="695" y2="300" class="arrow"/>
  
  <circle cx="720" cy="300" r="25" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <text x="720" y="307" text-anchor="middle" class="small-label" fill="white" font-weight="bold">✓</text>
  <text x="720" y="330" text-anchor="middle" class="small-label">就绪</text>
  <text x="720" y="345" text-anchor="middle" class="small-label">可用</text>
  
  <!-- Operation Details -->
  <rect x="50" y="420" width="900" height="320" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="500" y="445" text-anchor="middle" class="label" font-weight="bold">操作阶段 - 三种核心操作</text>
  
  <!-- Tools -->
  <rect x="80" y="470" width="250" height="240" rx="10" fill="white" stroke="#1976d2" stroke-width="2"/>
  <text x="205" y="495" text-anchor="middle" class="label" font-weight="bold">Tools（工具）</text>
  <line x1="80" y1="505" x2="330" y2="505" stroke="#1976d2" stroke-width="1"/>
  
  <text x="100" y="530" class="small-label">1. tools/list</text>
  <text x="100" y="550" class="small-label">   获取可用工具列表</text>
  
  <text x="100" y="580" class="small-label">2. tools/call</text>
  <text x="100" y="600" class="small-label">   调用指定工具</text>
  <text x="100" y="620" class="small-label">   • 传递参数</text>
  <text x="100" y="640" class="small-label">   • 执行函数</text>
  <text x="100" y="660" class="small-label">   • 返回结果</text>
  <text x="100" y="680" class="small-label">   • 处理错误</text>
  
  <!-- Resources -->
  <rect x="375" y="470" width="250" height="240" rx="10" fill="white" stroke="#7b1fa2" stroke-width="2"/>
  <text x="500" y="495" text-anchor="middle" class="label" font-weight="bold">Resources（资源）</text>
  <line x1="375" y1="505" x2="625" y2="505" stroke="#7b1fa2" stroke-width="1"/>
  
  <text x="395" y="530" class="small-label">1. resources/list</text>
  <text x="395" y="550" class="small-label">   列出可用资源</text>
  
  <text x="395" y="580" class="small-label">2. resources/read</text>
  <text x="395" y="600" class="small-label">   读取资源内容</text>
  <text x="395" y="620" class="small-label">   • 文件系统</text>
  <text x="395" y="640" class="small-label">   • 数据库</text>
  <text x="395" y="660" class="small-label">   • API 数据</text>
  
  <text x="395" y="690" class="small-label">3. resources/subscribe</text>
  <text x="395" y="710" class="small-label">   订阅资源更新</text>
  
  <!-- Prompts -->
  <rect x="670" y="470" width="250" height="240" rx="10" fill="white" stroke="#f57c00" stroke-width="2"/>
  <text x="795" y="495" text-anchor="middle" class="label" font-weight="bold">Prompts（提示）</text>
  <line x1="670" y1="505" x2="920" y2="505" stroke="#f57c00" stroke-width="1"/>
  
  <text x="690" y="530" class="small-label">1. prompts/list</text>
  <text x="690" y="550" class="small-label">   列出可用提示</text>
  
  <text x="690" y="580" class="small-label">2. prompts/get</text>
  <text x="690" y="600" class="small-label">   获取提示模板</text>
  <text x="690" y="620" class="small-label">   • 参数化配置</text>
  <text x="690" y="640" class="small-label">   • 上下文注入</text>
  <text x="690" y="660" class="small-label">   • 模板渲染</text>
  
  <text x="690" y="690" class="small-label">3. 简化交互</text>
  <text x="690" y="710" class="small-label">   预定义模式</text>
</svg>
